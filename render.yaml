services:
  - type: web
    name: peaje-web
    plan: free
    runtime: python
    rootDir: web
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: COOKIE_SEGURA
        value: "true"
      - key: INFERENCE_URL
        value: mock
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BASE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: INFERENCE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
